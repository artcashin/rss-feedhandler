[project]
name = "rss-ticker"
version = "8.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
rss-ticker = "rss_ticker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_ticker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned to the rule families this codebase was written and reviewed against.
# A floating `ruff>=0.7` dependency means new ruff releases enable new rules;
# without an explicit select, "lint passes" would mean something different on
# every machine. Tighten deliberately, not by version drift.
select = ["E4", "E7", "E9", "F"]
