# rss-ticker on a NAS, behind a Tailscale sidecar.
#
# The tailscale container owns the network namespace; the ticker joins it, so
# the pair appear on the tailnet as one node named "rss-ticker". NOTHING is
# published to the LAN -- with `bind_host: 127.0.0.1` in config/config.yaml,
# Tailscale Serve is the only way in, and reachability is the only access
# control this server has.
#
#   https://rss-ticker.your-tailnet.ts.net/   (Serve terminates TLS, real LE cert)
#
# The auth key lives in ./ts.env (chmod 600) and is NOT in this file.
services:
  tailscale:
    image: tailscale/tailscale:v1.98.9
    container_name: rss-ticker-ts
    hostname: rss-ticker
    restart: unless-stopped
    env_file:
      - ./ts.env
    environment:
      - TS_HOSTNAME=rss-ticker
      # MANDATORY. Kernel mode (this setting, plus the tun device and
      # NET_ADMIN below) makes the tailnet IP a real interface, so an app
      # bound to 127.0.0.1 is genuinely unreachable from the tailnet and
      # Serve is the only path to it. The image defaults to userspace
      # networking, where tailscaled terminates inbound tailnet connections
      # itself and forwards them to 127.0.0.1 -- a loopback bind is then
      # reachable AROUND Serve. Same hole if `bind_host` is 0.0.0.0: every
      # tailnet peer can hit the port directly. This server has no
      # authentication, so any peer that reaches it has full access --
      # it can make the server poll any URL and read every article.
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./ts-config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

  rss-ticker:
    image: ghcr.io/artcashin/rss-feedhandler:8.0.0
    container_name: rss-ticker
    restart: unless-stopped
    # Share the sidecar netns: the ticker has no network identity of its own,
    # and deliberately publishes no ports.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/config:ro
      - ./data:/data
