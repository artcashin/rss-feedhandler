# rss-ticker: a user-agnostic shared feed pool. Clients subscribe feeds over
# the websocket; nothing here names a feed, a user or a key. Every endpoint
# is open -- run this tailnet-only (or otherwise placed), never funneled.

# Articles a feed no longer lists are kept this long after they were last seen.
retention_days: 7

# Every feed polls at this interval. Be judicious: publishers monitor, and an
# over-eager poller gets throttled or disconnected. 90 suits a pool of wires;
# 300 suits blogs and newsletters.
default_poll_interval_s: 300

max_concurrent_polls: 8

# 0.0.0.0 inside a container whose port is not published; 127.0.0.1 when a
# proxy on the same host (Tailscale Serve) is the only intended way in.
# The tradeoff: 0.0.0.0 is reachable by anything that can route to this
# container's network -- and this server has no authentication.
bind_host: 0.0.0.0

# Optional: a Live TV widget for OpenBB Workspace / bdobb. Each channel is a
# YouTube @handle whose /live page is checked on demand (cached 5 minutes) for
# a currently-live stream. Omit this section, or leave it empty, and the
# feature is off: no widget appears in widgets.json and /api/live/* return 404.
# The first channel is the default shown in the widget's Channel picker.
live_tv:
  - key: bloomberg-tv
    label: Bloomberg TV
    handle: "@markets"          # Bloomberg Television's markets stream (default)
  - key: yahoo-finance
    label: Yahoo Finance
    handle: "@YahooFinance"
  - key: schwab-network
    label: Schwab Network
    handle: "@SchwabNetwork"
  - key: cnbc-television
    label: CNBC Television
    handle: "@CNBCtelevision"   # events only -- off-air (empty) between shows
